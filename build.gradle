/* We'll use the standard Java project layout expected by Gradle,
 * https://docs.gradle.org/current/userguide/java_plugin.html#sec:java_project_layout
 */
plugins {
    id 'java'
    id 'idea'
    id 'info.solidsoft.pitest' version '1.19.0-rc.1'
}

repositories {
    mavenCentral()
}

ext {
//    junitPlatformVersion = "1.8.2"
    junitPlatformVersion = "1.9.1"
//    junitJupiterVersion = "5.8.2"
    junitJupiterVersion = "5.9.3"
//    jqwikVersion = "1.6.5"
    jqwikVersion = "1.9.3"
//    assertJVersion = "3.12.2"
//    assertJVersion = "3.24.2"
    assertJVersion = "3.25.3"
}

compileJava {
    options.compilerArgs << '-Xlint:unchecked'
}

test {
    useJUnitPlatform {
        includeEngines 'jqwik'
        includeEngines 'junit-jupiter'
//        include '**/SampleTests.class'
        include '**/MaxProperties.class'
    }
}

dependencies {
    // aggregate jqwik dependency
    testImplementation "net.jqwik:jqwik:${jqwikVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"

    // engine and assertions for Junit5-based tests
    testRuntimeOnly "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"

    // adding AssertJ library (fluent interface)
    testImplementation "org.assertj:assertj-core:${assertJVersion}"
}

pitest {
    junit5PluginVersion = '1.2.1'
//    targetClasses = ['SampleProgs']
//    targetTests   = ['SampleTests']
    targetClasses = ['MaxPos']
    targetTests   = ['MaxProperties']
    outputFormats = ['HTML']
    timestampedReports = false
    mutators = ['ALL']
//    mutators = ['MATH']
    skipFailingTests = false
}